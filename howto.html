<h1>把同門會加到手機桌面</h1>
<ol>
<li><b>iPhone：</b>用 <b>Safari</b> 開啟本頁，點下方「分享」<span aria-hidden="true">⬆︎</span>，選「<b>加入主畫面</b>」。</li>
<li><b>Android：</b>用 <b>Chrome</b> 開啟本頁，點右上角「⋮」，選「<b>加到主畫面</b>」。</li>
<li>之後點桌面上的<b>同門會</b>圖示，就能直接登入（Google 或 LINE 都可以）。</li>
</ol>
